<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units</title>
    <style>
        html{
            font-size: 12px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            margin: 0;
        }
        .container{
            border:  3px solid black;
            width: 400px;
            height: 200px;
            margin: 50px auto 0;
            padding: 10px;
            background: papayawhip;
            display: flex;
            /* flex-direction: row; */
            /* flex-direction: row-reverse; */
            /* flex-direction: column; */
            /* flex-direction: column-reverse; */
            /* flex-wrap: wrap; */
            flex-flow: column wrap-reverse;
        }

        #box1{
            background: orangered;
        }
        #box2{
            background: yellowgreen;
        }
        #box3{
            background: mediumaquamarine;
        }
        #box4{
            background: hotpink;
        }
        #box5{
            background: green;
        }
        #box6{
            background: red;
        }
        #box7{
            background: blue;
        }
        #box8{
            background: black;
        }
        .items{
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            margin: 5px;
        }
      
    </style>
</head>
<body>
    <h1> welcome yahoo baba flex box and items</h1>
    <div class="container">
        <div id="box1" class="items">One </div>
        <div id="box2" class="items">Two </div>
        <div id="box3" class="items">Three </div>
        <div id="box4" class="items">Four</div>
        <div id="box5" class="items">Five </div>
        <div id="box6" class="items">Six </div>
        <div id="box7" class="items">Seven </div>
        <div id="box8" class="items">Eight</div>
    </div>
</body>
</html>
