<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            background-color: #eee;
            width: 700px;
            margin: 50px 0 0 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 100px 100px 100px 100px;
            grid-gap:  20px;

        }
        .items1{
            background-color: orangered;
            grid-row: 2/3;
            grid-column: 3/4;
            z-index: 1;
        }
        .items2{
            background-color: yellowgreen;
            grid-row: 2 / span 3;
        }
        .items3{
            background-color: slateblue;
            grid-column: 2/-1;
        }
        .items4{
            background-color: hotpink;
            grid-column: 2/4;
            grid-row: 2/3;
        }
        .items5{
            background-color: royalblue;
        }
        .items6{
            background-color: goldenrod;
            grid-row: 1/2;
            /* grid-column: 1/3; */
            /* grid-column: 1/ span 3; */
            grid-column: 1/ -1;
        }
    </style>
</head>
<body>
    <h1>Yahoo baba : css Grid  : Spainning </h1>
    <div class="container">
        <div class="items items1">First</div>
        <div class="items items2">Second</div>
        <div class="items items3">Third</div>
        <div class="items items4">Four</div>
        <div class="items items5">Five</div>
        <div class="items items6">Six</div>
    </div>
</body>
</html>
