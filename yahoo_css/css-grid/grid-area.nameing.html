<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            background-color: #eee;
            width: 720px;
            margin: 45px auto 0px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 120px 60px 100px 400px 50px;
            grid-gap:  15px;
            grid-template-areas: "header header header"
                                    "menu menu menu"
                                    "box1 box2 sidebar"
                                    "content content sidebar"
                                    "footer footer footer";
                                    

        }
        .header{
            background-color: orangered;
            grid-area: header;
        }
        .menus{
            background-color: yellowgreen;
            grid-area: menu;
        }
        .box1{
            background-color: slateblue;
            grid-area: box1;
        }
        .box2{
            background-color: hotpink;
            grid-area: box2;
        }
        .sidebar{
            background-color: royalblue;
            grid-area: sidebar;
        }
        .content{
            background-color: powderblue;
            grid-area: content;
        }
        .footer{
            background-color: goldenrod;
            grid-area: footer;
        }
    </style>
</head>
<body>
    <h1>Yahoo baba : css Grid  : Area Namming </h1>
    <div class="container">
        <div class="items header">header</div>
        <div class="items menus">menus</div>
        <div class="items box1">box1</div>
        <div class="items box2">box2</div>
        <div class="items sidebar">sidebar</div>
        <div class="items content">content</div>
        <div class="items footer">footer</div>
    </div>
</body>
</html>
