<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            background-color: #eee;
            width: 80%;
            margin: 50px 0 0 50px;

            display: grid;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(2,120px);
            grid-gap: 12px;
            grid-auto-rows: 100px;
            grid-auto-flow: column;
            /* grid-auto-columns: .5fr; */
            grid-auto-columns: 1fr;

        }
        .items1{
            background-color: orangered;
        }
        .items2{
            background-color: yellowgreen;
        }
        .items3{
            background-color: slateblue;
        }
        .items4{
            background-color: hotpink;
        }
        .items5{
            background-color: royalblue;
        }
        .items6{
            background-color: palevioletred;
        }
        .items7{
            background-color: goldenrod;
        }
        .items8{
            background-color: skyblue;
        }
        .items{
            color: white;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Yahoo baba : css Grid gap : implicit explicit   </h1>
    <div class="container">
        <div class="items items1">First. </div>
        <div class="items items2">Second</div>
        <div class="items items3">Third</div>
        <div class="items items4">Four </div>
        <div class="items items5">Five</div>
        <div class="items items6">Six</div>
        <div class="items items7">seven</div>
        <div class="items items8">eight</div>
    </div>
</body>
</html>
