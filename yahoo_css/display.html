<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        
      
       h1{
        /* display: none; */
       }
     
       ul{
        border: 2px solid black;
    }
    li{
        border: 1px solid red;
        display: inline;
    }
    span{
        /* display: block; */
        /* display: inline-block; */
        display: list-item;
        border: 2px solid green;
        width: 150px;
        padding: 5px;
        margin: 10px;
        list-style-position: inside;
    }
    a{
        /* display: block; */
        display: inline-block;
        border: 2px solid yellow;
        width: 200px;
        padding: 5px;
        margin: 10px;
    }
    </style>
</head>
<body>
    <h1>hello world css display</h1>
    <ul>
        <li>Orange</li>
        <li>Apple</li>
        <li>banana</li>
        <li>Grape</li>
        <li>Guava</li>
    </ul>
    <span>one</span>
    <span>two</span>
    <span>three</span>
    <span>four</span>
    <span>five</span>
    <a href="">1 ank</a>
    <a href="">2 ank</a>
    <a href="">3 ank</a>
</body>
</html>
