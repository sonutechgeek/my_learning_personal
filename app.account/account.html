<script>
    tabClick('personaldetail');

    function tabClick(tabName) {
        var tabname = tabName.toLowerCase();
        $('.common-center').hide();
        $('.tabs').addClass('inactiveTab');
        $('#' + tabname).removeClass('inactiveTab');
        if (tabname == 'personaldetail') {
            $('#personalDetailCentre').show();
            $('#myAddressCentre').hide();
            $('#bankDetailsCentre').hide();
            $('#changePasswordCentre').hide();
            $('#mykycCentre').hide();
        } else if (tabname == 'mykyc') {
            if (user.hasOwnProperty("username") && user.hasOwnProperty("mobileno") &&
                user.hasOwnProperty("mobile_verification") && user["username"].trim() != "" &&
                user["username"].trim().length > 0 && user["mobileno"] != "" && user["mobile_verification"] == "1") {
                $('#mykycCentre').show();
                $('#myAddressCentre').hide();
                $('#personalDetailCentre').hide();
                $('#bankDetailsCentre').hide();
                $('#changePasswordCentre').hide();
                kycTabButton();
            } else {
                successErrorAlert("error", "", "Please update personal details.");
                tabClick('personaldetail');
            }
        } else if (tabname == 'myaddress') {
            $('#myAddressCentre').show();
            $('#personalDetailCentre').hide();
            $('#bankDetailsCentre').hide();
            $('#changePasswordCentre').hide();
            $('#mykycCentre').hide();
            loadComponent("address", "REQ002", "", "", "", "#myAddressCentre");
        } else if (tabname == 'bankdetails') {
            $('#myAddressCentre').hide();
            $('#personalDetailCentre').hide();
            $('#bankDetailsCentre').show();
            $('#changePasswordCentre').hide();
            $('#mykycCentre').hide();
            loadComponent("bankdetails", "REQ002", "", "", "", "#bankDetailsCentre");
        } else {
            $('#myAddressCentre').hide();
            $('#personalDetailCentre').hide();
            $('#bankDetailsCentre').hide();
            $('#changePasswordCentre').show();
            $('#mykycCentre').hide();
            loadComponent("changempin", "REQ002", "", "", "", "#changePasswordCentre");
        }
    }
</script>
