<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        .container{
            background-color: #eee;
            width: 80%;
            margin: 70px 0 0 50px;
            display: grid;
            /* grid-template-columns: repeat(auto-fill, minmax(100px , 1fr)); */
            grid-template-columns: repeat(auto-fit, minmax(150px , 1fr));
            grid-template-rows: repeat(2,100px);
            grid-auto-rows: 100px;
        }
        .items1{
            background-color: orangered;
        }
        .items2{
            background-color: yellowgreen;
        }
        .items3{
            background-color: slateblue;
        }
        .items4{
            background-color: hotpink;
        }
        .items5{
            background-color: royalblue;
        }
        .items6{
            background-color: goldenrod;
        }
        .items{
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Yahoo baba : css Grid auto fill and fit </h1>
    <div class="container">
        <div class="items items1">First</div>
        <div class="items items2">Second</div>
        <div class="items items3">Third</div>
        <div class="items items4">Four</div>
        <div class="items items5">Five</div>
        <div class="items items6">Six</div>
    </div>
</body>
</html>
