    <h1>Arrow function</h1>
    <h5>
        <!-- In JavaScript, there are several ways to define functions, each with its own syntax and use cases. Here are the main types of functions you can write in JavaScript:
        1. **Function Declarations:**
        ```javascript
        function functionName(parameters) {
            // function body
        }
        ```
        Example:
        ```javascript
        function add(a, b) {
            return a + b;
        }
        ```

        2. **Function Expressions:**
        ```javascript
        const functionName = function(parameters) {
            // function body
        };
        ```
        Example:
        ```javascript
        const add = function(a, b) {
            return a + b;
        };
        ```
        3. **Arrow Functions (ES6):**
        ```javascript
        const functionName = (parameters) => {
            // function body
        };
        ```
        Example:
        ```javascript
        const add = (a, b) => {
            return a + b;
        };
        ```
        4. **Method Functions (within objects):**
        ```javascript
        const objectName = {
            methodName(parameters) {
                // method body
            }
        };
        ```
        Example:
        ```javascript
        const calculator = {
            add(a, b) {
                return a + b;
            },
            subtract(a, b) {
                return a - b;
            }
        };
        ```

        5. **Function Constructor:**
        ```javascript
        const functionName = new Function('parameter1', 'parameter2', '...','functionBody');
        ```
        Example:
        ```javascript
        const add = new Function('a', 'b', 'return a + b;');
        ```

        6. **Immediately Invoked Function Expression (IIFE):**
        ```javascript
        (function() {
            // function body
        })();
        ```
        Example:
        ```javascript
        (function(a, b) {
            console.log(a + b);
        })(2, 3); // Outputs: 5
        ```

        7. **Generator Functions (ES6):**
        ```javascript
        function* generatorFunction() {
            yield value;
        }
        ```
        Example:
        ```javascript
        function* count() {
            let i = 0;
            while (true) {
                yield i++;
            }
        }
        ```

        Each type of function has its own advantages and use cases, and choosing the appropriate one depends on the specific requirements of your code. -->
    </h5>
