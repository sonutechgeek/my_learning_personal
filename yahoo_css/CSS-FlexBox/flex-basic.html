<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>units</title>
    <style>
        html{
            font-size: 12px;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;
            margin: 0;
        }
        .container{
            border:  3px solid black;
            margin: 50px;
            /* padding: 10px; */
            display: flex;
           flex-wrap: wrap;
        }

        #box1{
            background: orangered;
            flex-basis: 200px;
    
        }
        #box2{
            background: yellowgreen;
        }
        #box3{
            background: mediumaquamarine;
        }
        #box4{
            background: hotpink;
           
        }
      
        .items{
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 0px;
            margin: 0px;
            height: 60px;
            flex-grow: 1;
            /* flex-basis: 100px; */

        }
      
    </style>
</head>
<body>
    <h1> welcome yahoo baba flex basics </h1>
    <div class="container">
        <div id="box1" class="items">One </div>
        <div id="box2" class="items">Two </div>
        <div id="box3" class="items">Three </div>
        <div id="box4" class="items">Four</div>

    </div>
</body>
</html>
